paths:
  work_dir: output
  cache_dir: output/cache

anchor:
  enabled: true
  max_chars: 1400

extract:
  mode: auto
  dpi: 300
  keep_page_renders: true
  vision_model: gpt-5.1
  timeout_s: 360
  max_workers: 2
  max_retries: 6
  retry_wait_s: 300.0
  batch_size: 3
  max_side: 1400
  jpeg_quality: 85
  use_layout_aware: true
  max_text_chunk_tokens: 2000
  caption_search_px: 100
  target_chunk_size: 1200  # Target size for merging small chunks (SciDuet)
  ocr:
    enabled: false
    engine: tesseract
    lang: eng
    min_conf: 50
    psm: 3
    on_pages: false
    on_figures: true

embed:
  backend: sentence_transformer
  model_name: google/embeddinggemma-300m
  device: cuda
  batch_size: 32
  dim: 0

retrieval:
  top_pages: 100
  top_units_dense: 150
  rrf_k: 60
  unit_image_weight: 1.15
  table_boost: 0.75
  figure_boost: 0.75
  min_table_candidates: 10
  min_figure_candidates: 10

selection:
  budget_tokens: 500  # Reduced for SciDuet (smaller chunks)
  alpha_visual: 0.35
  redundancy_beta: 0.1
  rel_weight: 1.0
  min_gain: 0.0
  coverage_weight: 0.5
  stopwords: []
  cognitive_cost_mode: emb
  cognitive_cost_device: cpu
  cognitive_cost_hf_model: "davanstrien/ModernBERT-based-Reasoning-Required"

openai:
  model: gpt-5.1
  temperature: 0.1

summarization:
  enabled: true
  max_chars_per_chunk: 1500
  required_sections:
    - Overview
    - Key Findings
    - Evidence
    - Risks
    - Next Steps

wandb:
  enabled: true
  project: icb-sum
  entity: ""
  tags: []

multi_anchor:
  enabled: true
  anchor_count: 5
  temperature: 1.0
  aggregation: mean

output:
  save_context_json: true
  save_highlighted_pdf: true
  save_run_output_json: false
  save_document_markdown: true
  run_output_filename: run_output.json

logging:
  level: INFO
  file: output/run.log
