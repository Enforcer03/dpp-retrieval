paths:
  work_dir: output
  cache_dir: output/cache

extract:
  mode: auto            # native | ocr | auto
  dpi: 200
  keep_page_renders: true
  keep_crops: true
  caption_search_px: 48
  max_text_chunk_tokens: 280
  ocr:
    enabled: false
    engine: tesseract   # tesseract | easyocr
    lang: eng
    min_conf: 45
    psm: 6
    on_pages: true
    on_figures: true

embed:
  backend: hash          # hf_siglip | hf_clip | hash
  model_name: google/siglip-so400m-patch14-384
  device: cpu
  batch_size: 8
  dim: 256

retrieval:
  top_pages: 6
  top_units_bm25: 80
  top_units_dense: 80
  rrf_k: 60
  unit_image_weight: 0.8
  table_boost: 0.25
  figure_boost: 0.25
  min_table_candidates: 3
  min_figure_candidates: 3

selection:
  budget_tokens: 25000
  alpha_visual: 0.2
  redundancy_beta: 0.35
  rel_weight: 1.0
  coverage_weight: 0.6
  min_gain: 1e-6
  stopwords:
    - the
    - a
    - an
    - and
    - or
    - of
    - to
    - in
    - for
    - on
    - with
    - by
    - at
    - from
    - as
    - is
    - are
    - was
    - were
    - be
    - been
    - being
    - that
    - this
    - these
    - those

openai:
  enabled: true
  model: gpt-5.1
  timeout_s: 60
  temperature: 0.1

summarization:
  enabled: true
  required_sections:
    - Overview
    - Key Findings
    - Evidence
    - Risks
    - Next Steps
  max_chars_per_chunk: 1200

llm_extraction:
  enabled: true
  model: gpt-5.1
  temperature: 0.2
  wrap_unit_tags: true
  max_units: 40
  max_chars_per_input: 12000
  save_raw: true

wandb:
  enabled: true
  project: icb-sum
  entity: null
  tags: []

output:
  save_context_json: true
  save_highlighted_pdf: true
  save_run_output_json: true
  run_output_filename: pipeline_output.json

logging:
  level: INFO
  file: output/run.log
