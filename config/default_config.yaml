paths:
  work_dir: output
  cache_dir: output/cache

# NEW (minimal): controls query-extension anchor used for retrieval
anchor:
  enabled: true
  max_chars: 1400

extract:
  mode: auto            # native | ocr | auto
  dpi: 300
  keep_page_renders: true
  keep_crops: true
  caption_search_px: 48
  max_text_chunk_tokens: 280
  vision_batch_size: 8  # pages per Vision API batch call (1-10 recommended)
  max_workers: 4
  max_retries: 6
  backoff_base_s: 1.0
  backoff_max_s: 20.0
  vision_max_side: 1400
  vision_jpeg_quality: 85
  use_layout_aware: true
  ocr:
    enabled: false
    engine: tesseract   # tesseract | easyocr
    lang: eng
    min_conf: 45
    psm: 6
    on_pages: true
    on_figures: true

embed:
  backend: hf_clip
  model_name: openai/clip-vit-base-patch32
  device: cuda
  batch_size: 32
  dim: 0   # <= 0 means "auto-infer"

retrieval:
  top_pages: 8
  top_units_bm25: 90
  top_units_dense: 110
  rrf_k: 60
  unit_image_weight: 1.15
  table_boost: 0.75
  figure_boost: 0.75
  min_table_candidates: 10
  min_figure_candidates: 10

selection:
  alpha_visual: 0.35
  redundancy_beta: 0.1
  budget_tokens: 25000
  rel_weight: 1.0
  coverage_weight: 0.6
  min_gain: 1e-6
  stopwords:
    - the
    - a
    - an
    - and
    - or
    - of
    - to
    - in
    - for
    - on
    - with
    - by
    - at
    - from
    - as
    - is
    - are
    - was
    - were
    - be
    - been
    - being
    - that
    - this
    - these
    - those

openai:
  enabled: true
  model: gpt-5.1
  timeout_s: 60
  temperature: 0.1

summarization:
  enabled: true
  required_sections:
    - Overview
    - Key Findings
    - Evidence
    - Risks
    - Next Steps
  max_chars_per_chunk: 1200

llm_extraction:
  enabled: false
  model: gpt-5.1
  temperature: 0.2
  wrap_unit_tags: true
  max_units: 300
  max_chars_per_input: 12000
  save_raw: true

wandb:
  enabled: true
  project: icb-sum
  entity: null
  tags: []

output:
  save_context_json: true
  save_highlighted_pdf: true
  save_run_output_json: true
  run_output_filename: pipeline_output.json

logging:
  level: INFO
  file: output/run.log
